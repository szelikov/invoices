services:
  backend:
    image: bip-backend
    container_name: bip-backend
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
      args:
        - PORT=$API_PORT
    user: $UID
    volumes:
    - ./backend/:/app
    depends_on:
    - db
    networks:
      bip-network: null
    environment:
    - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION}&charset=utf8
  frontend:
    image: bip-frontend
    container_name: bip-frontend
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
      args:
        - PORT=$FRONT_PORT
    volumes:
    - ./frontend/:/app
    depends_on:
    - backend
    networks:
      bip-network: null
  db:
    image: postgres:${POSTGRES_VERSION}-alpine3.22
    container_name: bip-db
    shm_size: 128mb
    environment:
    - POSTGRES_PASSWORD
    - POSTGRES_USER
    - POSTGRES_DB
    volumes:
    - db_data:/var/lib/postgresql/data
    networks:
      bip-network: null
  nginx:
    image: bip-nginx
    build:
      context: docker/nginx
    hostname: $BASE_HOST
    networks:
      bip-network: null
    depends_on:
    - frontend
    - backend

volumes:
  db_data:

networks:
  bip-network:
